<!DOCTYPE html>

<meta charset="utf-8">
<title>الصفحة غير موجودة | أحمد الشيخ</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Sends any broken URL to the site's custom 404 view.
  // Works on username.github.io/repo-name/ and on a custom domain.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = (location.hostname.endsWith('github.io') && seg.length) ? '/' + seg[0] + '/' : '/';
    location.replace(base + '#notfound');
  })();
</script>
